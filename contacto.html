        </header>
        <main>
            <section class="contact">
                <div class="wrap">
                    <div class="contact-intro">
                        <h1>Contacto</h1>
                        <p>Para propuestas de conciertos, entrevistas, colaboraciones, prensa y otras cuestiones relacionadas con Sofy Norcross:</p>
                        <p class="email">
                            Email:
                            <a href="mailto:sofynorcross@gmail.com">sofynorcross@gmail.com</a>
                        </p>
                    </div>
                    <form class="contact-form" novalidate>
                        <div class="field">
                            <label for="nombre">Nombre *</label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                required
                            >
                        </div>
                        <div class="field">
                            <label for="apellido">Apellido *</label>
                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                required
                            >
                        </div>
                        <div class="field">
                            <label for="email">Email *</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                required
                            >
                        </div>
                        <div class="field">
                            <label for="telefono">Teléfono</label>
                            <div class="phone-field">
                                <input
                                    type="text"
                                    id="prefijo"
                                    name="prefijo"
                                    placeholder="+34"
                                    aria-label="Prefijo telefónico"
                                    maxlength="5"
                                >
                                <input type="tel" id="telefono" name="telefono">
                            </div>
                        </div>
                        <div class="field full">
                            <label for="mensaje">Tu mensaje</label>
                            <textarea id="mensaje" name="mensaje" rows="4"></textarea>
                        </div>
                        <div class="field full">
                            <label for="conocido">¿Cómo me has conocido?</label>
                            <input type="text" id="conocido" name="conocido">
                        </div>
                        <div class="form-submit">
                            <button type="submit" class="btn">Enviar</button>
                        </div>
                        <p class="form-status" role="status"></p>
                    </form>
                </div>
            </section>
            <div class="home-link-wrap">
                <a href="index.html" class="btn btn-outline home-link">Inicio &rsaquo;</a>
            </div>
        </main>
        <footer class="site-footer">

        </footer>
